<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#850D32" />
  <meta name="description" content="Gisel Studio de Belleza — uñas, lashista, depilación, catálogo y combos especiales." />
  <title>Gisel Studio de Belleza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link id="site-favicon" rel="icon" href="assets/favicon-final.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home" data-base=".">
  <main class="home-shell">
    <section class="home-hero" aria-label="Gisel Studio de Belleza">
      <div class="logo-stage">
        <img id="home-logo" src="assets/logo-principal-final.webp" alt="Gisel Studio de Belleza" />
      </div>
      <p class="service-line">UÑAS <span>♥</span> LASHISTA <span>♥</span> DEPILACIÓN</p>
      <nav id="socials" class="socials" aria-label="Redes sociales"></nav>
    </section>
    <section id="home-actions" class="actions" aria-label="Enlaces principales"></section>
    <footer class="home-footer">
      <img id="footer-round-logo" src="assets/logo-circular-final.webp" alt="Gisel Studio de Belleza" />
      <div>
        <strong id="footer-brand">Gisel Studio de Belleza</strong>
        <span id="footer-city">Posadas</span>
      </div>
    </footer>
  </main>
  <script src="assets/site.js"></script>
</body>
</html>
