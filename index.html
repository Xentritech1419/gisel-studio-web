<body>
  <main class="page-shell">
    <div class="metal-wave metal-wave--one" aria-hidden="true"></div>

    <section class="hero" aria-label="Gisel Studio de Belleza">
      <div class="hero-logo-wrap">

      <a class="action-card" href="landings/combos-promos.html">
        <span class="action-icon" aria-hidden="true"><i class="bi bi-stars"></i></span>
        <span class="action-copy">

        <span class="action-arrow" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>

        <span class="action-copy">
          <small>Escribinos por</small>
          <strong>WHATSAPP</strong>
        </span>
        <span class="action-arrow" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
      </a>

      <a class="action-card" href="landings/catalogo-servicios.html">
        <span class="action-icon" aria-hidden="true"><i class="bi bi-bag-heart-fill"></i></span>
        <span class="action-copy">
          <small>Conocé nuestro</small>
          <strong>CATÁLOGO</strong>
        </span>
